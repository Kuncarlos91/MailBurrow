name: Flutter checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  privacy-guard:
    name: Check tracked-file privacy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test privacy guard
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Check tracked and non-ignored files
        run: python3 tools/privacy_check.py
      - name: Check local documentation links
        run: python3 tools/check_docs.py

  analyze-and-test:
    name: Analyze and test Flutter
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze code
        run: flutter analyze --no-pub --fatal-infos
      - name: Run tests
        run: |
          set +e
          flutter test --no-pub --reporter json > /tmp/results.json
          code=$?
          python3 - <<'PY'
          import json
          tests, logs, failed = {}, {}, []
          for line in open('/tmp/results.json'):
              try: e = json.loads(line)
              except Exception: continue
              kind = e.get('type')
              if kind == 'testStart':
                  t = e['test']; tests[t['id']] = (t['name'], t.get('root_url') or t.get('url') or '', t.get('root_line') or t.get('line') or 1)
              elif kind == 'error':
                  logs.setdefault(e['testID'], []).append(e.get('error', ''))
              elif kind == 'print' and e.get('testID') is not None:
                  logs.setdefault(e['testID'], []).append(e.get('message', ''))
              elif kind == 'testDone' and e.get('result') != 'success' and not e.get('hidden'):
                  failed.append(e['testID'])
          for tid in failed[:10]:
              name, url, line = tests.get(tid, ('?', '', 1))
              path = url.split('/MailBurrow/')[-1] if url else 'test'
              lines = [l.strip() for l in '\n'.join(logs.get(tid, [])).splitlines()]
              keep = [l for l in lines if l and not l.startswith(('═', '#', 'When the exception', 'The test description', 'Test failed', 'package:'))]
              msg = ' | '.join(keep)[:3500].replace('%', '%25').replace('\r', '').replace('\n', ' ')
              print(f"::error file={path},line={line},title={name[:120]}::{msg}")
          PY
          exit $code
